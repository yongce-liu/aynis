[project]
name = "video2scene"
version = "0.3.0"
description = "Video-to-Blender-to-Genesis reconstruction and parallel simulation datasets"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Yongce Liu" }]
dependencies = [
    "genesis-world>=1.3.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "bpy>=5.2.1",
    "mujoco-warp>=3.12.0",
    "pillow>=11.3",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "mujoco>=3.12.0",
    "warp-lang>=1.17.0",
    "fast-simplification>=0.2.0",
    "trimesh>=5.1.0",
    "rtree>=1.4.1",
    "newton>=1.5.1",
    "jsonschema>=4.23,<5",
    "tyro>=0.9",
    "loguru>=0.7",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"
name = "pytorch-cu128"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video2scene"]
